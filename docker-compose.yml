services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: barber_queue
    ports:
      - "10110:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./api/db/migrations/002_users_auth.sql:/docker-entrypoint-initdb.d/002_users_auth.sql:ro
      - ./api/db/seed_users.sql:/docker-entrypoint-initdb.d/003_seed_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    ports:
      - "10120:8080"
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://barber:barber@postgres:5432/barber_queue?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-use-32-char-minimum-secret!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "10130:3000"
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:10120
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-use-32-char-minimum-secret!!}
    depends_on:
      - api

volumes:
  pgdata:
